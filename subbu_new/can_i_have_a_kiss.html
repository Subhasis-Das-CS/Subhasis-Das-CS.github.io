<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Can I Please Have a Kiss? 🐣💋</title>

  <!-- Google Fonts: Cormorant Garamond (Romantic Serif) & Plus Jakarta Sans (Clean Modern UI) -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;0,700;1,500;1,600&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap"
    rel="stylesheet"
  />

  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            serif: ['"Cormorant Garamond"', 'Georgia', 'serif'],
            sans: ['"Plus Jakarta Sans"', 'system-ui', 'sans-serif'],
          },
          colors: {
            midnight: '#160b14',
            burgundy: '#2b1121',
            gold: {
              light: '#f9e6c0',
              DEFAULT: '#e5c07b',
              warm: '#d4a359',
            },
            rose: {
              blush: '#f7d3db',
              petal: '#e27b92',
              deep: '#8a2542',
            },
          },
        },
      },
    };
  </script>

  <style>
    /* Velvety Romantic Backdrop */
    html,
    body {
      margin: 0;
      padding: 0;
      min-height: 100%;
      background: radial-gradient(circle at 50% 20%, #3a162c 0%, #230d1b 52%, #150912 100%);
      color: #fdf4f6;
      overflow-x: hidden;
      -webkit-tap-highlight-color: transparent;
    }

    /* Glassmorphic Card */
    .glass-card {
      background: linear-gradient(
        145deg,
        rgba(52, 20, 39, 0.78) 0%,
        rgba(24, 10, 20, 0.9) 100%
      );
      backdrop-filter: blur(18px);
      -webkit-backdrop-filter: blur(18px);
      border: 1px solid rgba(229, 192, 123, 0.28);
      box-shadow:
        0 26px 65px -14px rgba(0, 0, 0, 0.7),
        inset 0 1px 0 rgba(249, 230, 192, 0.16);
    }

    /* Shimmering Gold Heading Gradient */
    .text-gold-gradient {
      background: linear-gradient(120deg, #fff1d6 0%, #e5c07b 52%, #f7d8a1 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    /* Card Transition Animation */
    @keyframes popIn {
      0% {
        opacity: 0;
        transform: translateY(16px) scale(0.96);
      }
      100% {
        opacity: 1;
        transform: translateY(0) scale(1);
      }
    }

    .animate-pop-in {
      animation: popIn 0.45s cubic-bezier(0.22, 1, 0.36, 1) forwards;
    }

    /* 🐣 Mascot Mood Animations */
    @keyframes chickIdle {
      0%, 100% {
        transform: translateY(0) rotate(0deg);
      }
      50% {
        transform: translateY(-7px) rotate(3deg);
      }
    }

    @keyframes chickPlead {
      0%, 100% {
        transform: translateY(0) scale(1);
      }
      30% {
        transform: translateY(-4px) scale(1.04) rotate(-6deg);
      }
      65% {
        transform: translateY(1px) scale(0.97) rotate(6deg);
      }
    }

    @keyframes chickPout {
      0%, 100% {
        transform: translateX(0) rotate(0deg);
      }
      25% {
        transform: translateX(-5px) rotate(-7deg);
      }
      75% {
        transform: translateX(5px) rotate(7deg);
      }
    }

    @keyframes chickClever {
      0%, 100% {
        transform: scale(1) rotate(-4deg);
      }
      50% {
        transform: scale(1.08) rotate(5deg);
      }
    }

    /* Joyful Dancing Animation for the "YES" Celebration */
    @keyframes chickDance {
      0% {
        transform: translateY(0) rotate(-10deg) scale(1, 1);
      }
      20% {
        transform: translateY(-20px) rotate(12deg) scale(1.08, 0.96);
      }
      40% {
        transform: translateY(0) rotate(10deg) scale(0.95, 1.06);
      }
      60% {
        transform: translateY(-22px) rotate(-14deg) scale(1.08, 0.96);
      }
      80% {
        transform: translateY(-4px) rotate(8deg) scale(1.02, 0.98);
      }
      100% {
        transform: translateY(0) rotate(-10deg) scale(1, 1);
      }
    }

    @keyframes noteFloat {
      0% {
        opacity: 0;
        transform: translateY(10px) scale(0.75) rotate(-10deg);
      }
      40% {
        opacity: 1;
      }
      100% {
        opacity: 0;
        transform: translateY(-34px) scale(1.15) rotate(14deg);
      }
    }

    @keyframes danceFloorPulse {
      0%, 100% {
        transform: scale(1);
        opacity: 0.45;
      }
      50% {
        transform: scale(1.22);
        opacity: 0.85;
      }
    }

    .chick-idle {
      animation: chickIdle 2.4s ease-in-out infinite;
    }
    .chick-plead {
      animation: chickPlead 1.6s ease-in-out infinite;
    }
    .chick-pout {
      animation: chickPout 1.1s ease-in-out infinite;
    }
    .chick-clever {
      animation: chickClever 2s ease-in-out infinite;
    }
    .chick-dance {
      animation: chickDance 0.85s cubic-bezier(0.34, 1.56, 0.64, 1) infinite;
    }
    .note-float-1 {
      animation: noteFloat 1.8s ease-out infinite;
    }
    .note-float-2 {
      animation: noteFloat 1.8s ease-out 0.6s infinite;
    }
    .note-float-3 {
      animation: noteFloat 1.8s ease-out 1.2s infinite;
    }
    .dance-floor-glow {
      animation: danceFloorPulse 0.85s ease-in-out infinite;
    }

    /* Yes Button Gentle Glow Pulse */
    @keyframes yesPulse {
      0%, 100% {
        box-shadow: 0 8px 26px rgba(229, 192, 123, 0.28);
      }
      50% {
        box-shadow: 0 10px 34px rgba(226, 123, 146, 0.55);
      }
    }

    .yes-glow {
      animation: yesPulse 2s ease-in-out infinite;
    }

    /* Click Burst DOM Particles */
    @keyframes burstFly {
      0% {
        opacity: 1;
        transform: translate(-50%, -50%) scale(0.4) rotate(0deg);
      }
      100% {
        opacity: 0;
        transform: translate(calc(-50% + var(--tx)), calc(-50% + var(--ty))) scale(var(--sc)) rotate(var(--rot));
      }
    }

    .burst-particle {
      position: fixed;
      pointer-events: none;
      z-index: 999;
      animation: burstFly var(--dur) cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }
  </style>
</head>
<body class="font-sans antialiased selection:bg-rose-petal/30 selection:text-gold-light">
  <!-- Ambient Floating Hearts, Sparkles & Celebration Confetti Canvas -->
  <canvas
    id="bgCanvas"
    class="fixed inset-0 w-full h-full pointer-events-none z-0"
    aria-hidden="true"
  ></canvas>

  <!-- Centered Full-Viewport App Wrapper -->
  <div class="relative z-10 min-h-[100dvh] w-full flex flex-col items-center justify-center px-4 py-6 sm:px-6">
    <main id="cardStage" class="w-full max-w-md" aria-live="polite">
      <!-- Dynamic Interactive Card Rendered Here -->
    </main>

    <!-- Subtle Footer Signature -->
    <p class="mt-5 text-[11px] sm:text-xs tracking-[0.18em] uppercase text-gold-light/45 text-center select-none">
      Made with love by your smoll baby 🐣
    </p>
  </div>

  <script>
    /**
     * ============================================================================
     * STAGE CONFIGURATION
     * Index 0        : Initial Question ("Can you please give me a kiss?")
     * Indices 1 - 10 : 10 Continuous "No"-related pages leading up to the
     *                  clever final stage where ONLY the "Yes" button remains!
     * ============================================================================
     */
    const STAGES = [
      // Stage 0: Opening Question
      {
        badge: 'A Tiny Request 💎✨',
        chickEmoji: '🐣',
        moodBadge: '💌',
        animClass: 'chick-idle',
        heading: 'Can you please give me a kiss?',
        subtext: 'Your smoll baby 🐣 is waiting right here with the biggest smile for you, my Subbu…',
        yesText: 'Yes 💋',
        noText: 'No 🙈',
        onlyYes: false,
      },
      // No Page 1 of 10
      {
        badge: 'Please #1 of 10',
        chickEmoji: '🐣',
        moodBadge: '🥺',
        animClass: 'chick-plead',
        heading: 'Aww… please? Just one tiny kiss?',
        subtext: 'Not even a quick little cheek kiss for your smoll baby 🐣, my Momo?',
        yesText: 'Okay, Yes 💋',
        noText: 'Still No',
        onlyYes: false,
      },
      // No Page 2 of 10
      {
        badge: 'Please #2 of 10',
        chickEmoji: '🐣',
        moodBadge: '🥹',
        animClass: 'chick-plead',
        heading: 'Pretty please, my Subbu?',
        subtext: 'Look at these big shiny puppy eyes on your 🐣… how can you say no to this face?',
        yesText: 'Fine, Yes 💋',
        noText: 'Nope 🤭',
        onlyYes: false,
      },
      // No Page 3 of 10
      {
        badge: 'Please #3 of 10',
        chickEmoji: '🐣',
        moodBadge: '💨',
        animClass: 'chick-plead',
        heading: 'Not even a 0.5-second flying kiss?',
        subtext: 'I promise I’ll catch it mid-air and keep it safe in my pocket forever, my 💎✨!',
        yesText: 'Sending One 💋',
        noText: 'No Way',
        onlyYes: false,
      },
      // No Page 4 of 10
      {
        badge: 'Please #4 of 10',
        chickEmoji: '🐣',
        moodBadge: '😤',
        animClass: 'chick-pout',
        heading: 'Hey! My little 🐣 heart is pouting now…',
        subtext: 'Look what you did, my Momo—I have my full dramatic pouty face on until I get my kiss!',
        yesText: 'Aww Yes 💋',
        noText: 'Keep Pouting',
        onlyYes: false,
      },
      // No Page 5 of 10
      {
        badge: 'Please #5 of 10',
        chickEmoji: '🐣',
        moodBadge: '🤝',
        animClass: 'chick-plead',
        heading: 'Okay, let’s make a sweet deal!',
        subtext: 'I will trade you 100 tight warm hugs and endless forehead kisses for just 1 kiss from you. Deal?',
        yesText: 'Deal! Yes 💋',
        noText: 'No Deal',
        onlyYes: false,
      },
      // No Page 6 of 10
      {
        badge: 'Please #6 of 10',
        chickEmoji: '🐣',
        moodBadge: '😭',
        animClass: 'chick-pout',
        heading: 'Still no?! Your 🐣 is melting into a puddle!',
        subtext: 'Please, my Subbu… only a kiss from you has the magic power to revive your smoll baby 🐣!',
        yesText: 'Revive Me 💋',
        noText: 'Still No',
        onlyYes: false,
      },
      // No Page 7 of 10
      {
        badge: 'Please #7 of 10',
        chickEmoji: '🐣',
        moodBadge: '✨',
        animClass: 'chick-plead',
        heading: 'Pleeease, my precious 💎✨…',
        subtext: 'You know one tiny kiss from you makes me grin like a happy little 🐣 for the whole day.',
        yesText: 'Yes, Come Here 💋',
        noText: 'Not Yet',
        onlyYes: false,
      },
      // No Page 8 of 10
      {
        badge: 'Please #8 of 10',
        chickEmoji: '🐣',
        moodBadge: '🙏',
        animClass: 'chick-plead',
        heading: 'I’m officially begging on my tiny 🐣 knees!',
        subtext: 'Pretty pretty please with a cherry on top, my Momo… just tap that shiny Yes button!',
        yesText: 'Okay Yes! 💋',
        noText: 'Hehe No',
        onlyYes: false,
      },
      // No Page 9 of 10
      {
        badge: 'Please #9 of 10',
        chickEmoji: '🐣',
        moodBadge: '👀',
        animClass: 'chick-pout',
        heading: 'Last warning before I get sneaky…',
        subtext: 'If you press No one more time, your smoll baby 🐣 is going to take matters into his own tiny wings!',
        yesText: 'Give Kiss Now 💋',
        noText: 'Try Me 😜',
        onlyYes: false,
      },
      // No Page 10 of 10 — The Clever Smile Finale (ONLY "Yes" Button!)
      {
        badge: 'Page 10 of 10 · Checkmate 😏',
        chickEmoji: '🐣',
        moodBadge: '😏',
        animClass: 'chick-clever',
        heading: 'Hehe 😏 Looks like you have to say Yes now!',
        subtext: 'Oops! The “No” button mysteriously disappeared… My Subbu has no choice left—tap Yes and give your smoll baby 🐣 that kiss! 💎✨',
        yesText: 'YES! Here’s Your Kiss 💋',
        noText: null,
        onlyYes: true,
      },
    ];

    /**
     * ============================================================================
     * APP STATE & RENDERING
     * ============================================================================
     */
    let currentStage = 0;
    let isCelebrating = false;
    const cardStage = document.getElementById('cardStage');

    function renderStage() {
      const stage = STAGES[currentStage];
      const noCount = currentStage; // 0 on initial, 1..10 on No pages

      // Subtle playful growth on the Yes button as she clicks No (clamped cleanly for mobile)
      const yesPaddingClass =
        noCount >= 7
          ? 'px-8 py-4 text-base'
          : noCount >= 4
          ? 'px-7 py-3.5 text-[15px]'
          : 'px-6 py-3 text-sm sm:text-[15px]';

      cardStage.innerHTML = `
        <section class="glass-card rounded-3xl p-6 sm:p-8 text-center animate-pop-in">
          <!-- Stage Pill -->
          <div class="inline-flex items-center gap-2 px-3.5 py-1 rounded-full bg-gold/10 border border-gold/30 text-[11px] uppercase tracking-[0.2em] text-gold-light mb-5">
            <span>${stage.onlyYes ? '😏' : '✦'}</span>
            <span>${stage.badge}</span>
          </div>

          <!-- Expressive 🐣 Mascot Circle -->
          <div class="relative w-28 h-28 sm:w-32 sm:h-32 mx-auto mb-5 flex items-center justify-center">
            <div class="absolute inset-0 rounded-full bg-gradient-to-tr from-rose-petal/30 via-gold/20 to-gold-light/30 blur-md"></div>
            <div class="relative w-24 h-24 sm:w-28 sm:h-28 rounded-full bg-burgundy/90 border-2 border-gold/45 flex items-center justify-center shadow-2xl">
              <span class="text-5xl sm:text-6xl select-none inline-block ${stage.animClass}" role="img" aria-label="Subhasis chick">
                ${stage.chickEmoji}
              </span>
              <span class="absolute -top-1 -right-1 w-9 h-9 rounded-full bg-midnight/90 border border-gold/45 flex items-center justify-center text-lg shadow-lg select-none">
                ${stage.moodBadge}
              </span>
            </div>
          </div>

          <!-- Heading & Cute Romantic Message -->
          <h1 class="font-serif text-3xl sm:text-4xl font-semibold text-gold-gradient leading-tight mb-3">
            ${stage.heading}
          </h1>
          <p class="text-sm sm:text-[15px] text-rose-blush/90 leading-relaxed max-w-sm mx-auto mb-7">
            ${stage.subtext}
          </p>

          <!-- Progress Dots for the 10 No Pages (Visible once she clicks No) -->
          ${
            noCount > 0
              ? `
            <div class="flex items-center justify-center gap-1.5 mb-6" aria-label="Pleading progress ${noCount} of 10">
              ${Array.from({ length: 10 }, (_, idx) => {
                const filled = idx < noCount;
                return `<span class="h-1.5 rounded-full transition-all duration-300 ${
                  filled ? 'w-4 bg-gradient-to-r from-rose-petal to-gold-light' : 'w-1.5 bg-white/20'
                }"></span>`;
              }).join('')}
            </div>
          `
              : ''
          }

          <!-- Action Buttons (Always centered & responsive inside viewport) -->
          <div class="flex flex-wrap items-center justify-center gap-3">
            <button
              id="yesBtn"
              type="button"
              class="yes-glow ${yesPaddingClass} ${
                stage.onlyYes ? 'w-full sm:w-auto' : ''
              } rounded-full font-semibold text-midnight bg-gradient-to-r from-gold-light via-gold to-gold-warm hover:brightness-110 active:scale-95 transition-all duration-300 focus:outline-none focus:ring-2 focus:ring-gold-light"
            >
              ${stage.yesText}
            </button>

            ${
              !stage.onlyYes
                ? `
              <button
                id="noBtn"
                type="button"
                class="px-5 py-3 rounded-full text-sm font-medium text-rose-blush/85 hover:text-white bg-white/[0.06] hover:bg-white/[0.13] border border-gold/25 active:scale-95 transition-all duration-300 focus:outline-none focus:ring-2 focus:ring-gold/40"
              >
                ${stage.noText}
              </button>
            `
                : ''
            }
          </div>
        </section>
      `;

      // Bind Yes button -> Launch Dancing Celebration
      document.getElementById('yesBtn').addEventListener('click', (e) => {
        const vw = window.innerWidth;
        const vh = window.innerHeight;
        spawnBurst(e.clientX || vw / 2, e.clientY || vh / 2, 26, ['💋', '💖', '🐣', '✨', '💎']);
        startCelebration();
      });

      // Bind No button -> Advance through the 10 continuous No stages
      const noBtn = document.getElementById('noBtn');
      if (noBtn) {
        noBtn.addEventListener('click', (e) => {
          spawnBurst(e.clientX, e.clientY, 8, ['🥺', '💔', '🐣']);
          if (currentStage < STAGES.length - 1) {
            currentStage++;
            renderStage();
          }
        });
      }
    }

    /**
     * ============================================================================
     * CELEBRATING & DANCING SCREEN (Shown when she taps YES!)
     * ============================================================================
     */
    function startCelebration() {
      isCelebrating = true;
      launchConfettiWave();

      const extraNote =
        currentStage === 0
          ? 'You said YES on the very first try!! My heart is doing backflips right now!'
          : currentStage === 10
          ? 'Hehe 😏 I knew my clever plan would work! Thank you for the kiss, my Subbu!'
          : `After ${currentStage} adorable little ${currentStage === 1 ? 'tease' : 'teases'}, you finally said YES!!`;

      cardStage.innerHTML = `
        <section class="glass-card rounded-3xl p-6 sm:p-8 text-center animate-pop-in relative overflow-hidden">
          <!-- Celebration Pill -->
          <div class="inline-flex items-center gap-2 px-4 py-1 rounded-full bg-rose-petal/20 border border-gold-light/40 text-[11px] uppercase tracking-[0.22em] text-gold-light mb-5">
            <span>🎉</span>
            <span>YAY!! Kiss Received</span>
            <span>💋</span>
          </div>

          <!-- Dancing 🐣 Stage with Floating Music Notes & Dance Floor Glow -->
          <div class="relative w-44 h-36 mx-auto mb-5 flex items-center justify-center">
            <!-- Pulsing Dance Floor Spotlight -->
            <div class="dance-floor-glow absolute bottom-2 w-28 h-8 rounded-full bg-gradient-to-r from-rose-petal/60 via-gold/65 to-rose-petal/60 blur-md"></div>

            <!-- Floating Music Notes & Kisses -->
            <span class="note-float-1 absolute left-3 top-6 text-xl select-none">🎶</span>
            <span class="note-float-2 absolute right-3 top-4 text-xl select-none">💋</span>
            <span class="note-float-3 absolute right-8 bottom-8 text-lg select-none">✨</span>

            <!-- Happy Dancing 🐣 Centerpiece -->
            <div class="relative flex items-end justify-center gap-2">
              <span class="text-2xl animate-bounce select-none" style="animation-delay: 0.15s;">💖</span>
              <span class="text-7xl sm:text-8xl inline-block chick-dance select-none drop-shadow-[0_12px_20px_rgba(0,0,0,0.5)]" role="img" aria-label="Dancing happy chick">
                🐣
              </span>
              <span class="text-2xl animate-bounce select-none" style="animation-delay: 0.35s;">💎</span>
            </div>
          </div>

          <!-- Romantic Celebration Copy -->
          <h1 class="font-serif text-3xl sm:text-4xl font-semibold text-gold-gradient leading-tight mb-2.5">
            Yaaay!! Happy Dance Time! 💃🐣🕺
          </h1>
          <p class="font-serif italic text-base sm:text-lg text-gold-light/95 mb-3">
            ${extraNote}
          </p>
          <p class="text-sm sm:text-[15px] text-rose-blush/90 leading-relaxed max-w-sm mx-auto mb-7">
            Mwah!! Your smoll baby 🐣 is officially the happiest, luckiest guy right now. I love you so much, my Subbu, my Momo, my precious 💎✨!
          </p>

          <!-- Interactive Celebration Buttons -->
          <div class="flex flex-col sm:flex-row items-center justify-center gap-3">
            <button
              id="moreKissesBtn"
              type="button"
              class="w-full sm:w-auto yes-glow px-6 py-3.5 rounded-full text-sm font-semibold text-midnight bg-gradient-to-r from-gold-light via-gold to-gold-warm hover:brightness-110 active:scale-95 transition-all duration-300 focus:outline-none focus:ring-2 focus:ring-gold-light"
            >
              Give Another Kiss 💋
            </button>

            <button
              id="replayBtn"
              type="button"
              class="w-full sm:w-auto px-5 py-3.5 rounded-full text-sm font-medium text-gold-light/85 hover:text-gold-light bg-white/[0.06] hover:bg-white/[0.12] border border-gold/25 active:scale-95 transition-all duration-300 focus:outline-none focus:ring-2 focus:ring-gold/40"
            >
              ↺ Ask Again
            </button>
          </div>
        </section>
      `;

      document.getElementById('moreKissesBtn').addEventListener('click', (e) => {
        const vw = window.innerWidth;
        const vh = window.innerHeight;
        spawnBurst(e.clientX || vw / 2, e.clientY || vh / 2, 24, ['💋', '💖', '🐣', '💎', '✨']);
        setTimeout(() => spawnBurst(vw * 0.25, vh * 0.35, 14, ['💋', '✨', '💖']), 140);
        setTimeout(() => spawnBurst(vw * 0.75, vh * 0.35, 14, ['💋', '💎', '🐣']), 260);
        launchConfettiWave();
      });

      document.getElementById('replayBtn').addEventListener('click', () => {
        isCelebrating = false;
        currentStage = 0;
        renderStage();
      });
    }

    /**
     * ============================================================================
     * CLICK EMOJI BURST EFFECT
     * ============================================================================
     */
    function spawnBurst(x, y, count = 16, symbols = ['💋', '♥', '✨', '💎']) {
      for (let i = 0; i < count; i++) {
        const el = document.createElement('span');
        el.className = 'burst-particle select-none';
        el.textContent = symbols[Math.floor(Math.random() * symbols.length)];
        el.style.left = `${x}px`;
        el.style.top = `${y}px`;
        el.style.fontSize = `${14 + Math.random() * 14}px`;

        const angle = (Math.PI * 2 * i) / count + (Math.random() - 0.5) * 0.6;
        const dist = 50 + Math.random() * 110;
        el.style.setProperty('--tx', `${Math.cos(angle) * dist}px`);
        el.style.setProperty('--ty', `${Math.sin(angle) * dist - 42}px`);
        el.style.setProperty('--sc', (0.85 + Math.random() * 0.8).toFixed(2));
        el.style.setProperty('--rot', `${Math.floor(Math.random() * 80 - 40)}deg`);
        el.style.setProperty('--dur', `${0.75 + Math.random() * 0.55}s`);

        document.body.appendChild(el);
        setTimeout(() => el.remove(), 1400);
      }
    }

    /**
     * ============================================================================
     * AMBIENT FLOATING PARTICLES & CELEBRATION CONFETTI CANVAS
     * ============================================================================
     */
    const canvas = document.getElementById('bgCanvas');
    const ctx = canvas.getContext('2d');
    let ambientParticles = [];
    let confettiParticles = [];

    function resizeCanvas() {
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
    }

    function initAmbientParticles() {
      ambientParticles = [];
      const count = window.innerWidth < 640 ? 34 : 58;
      for (let i = 0; i < count; i++) {
        ambientParticles.push({
          x: Math.random() * canvas.width,
          y: Math.random() * canvas.height,
          r: 1.2 + Math.random() * 2.4,
          vy: -(0.2 + Math.random() * 0.45),
          vx: (Math.random() - 0.5) * 0.3,
          alpha: 0.2 + Math.random() * 0.55,
          color: Math.random() > 0.4 ? '#f9e6c0' : '#e27b92',
        });
      }
    }

    function launchConfettiWave() {
      const colors = ['#f9e6c0', '#e5c07b', '#f7d3db', '#e27b92', '#ff9eb5', '#ffffff'];
      for (let i = 0; i < 75; i++) {
        confettiParticles.push({
          x: Math.random() * canvas.width,
          y: -15 - Math.random() * 140,
          w: 6 + Math.random() * 6,
          h: 4 + Math.random() * 5,
          vx: (Math.random() - 0.5) * 2.6,
          vy: 2 + Math.random() * 3.4,
          rot: Math.random() * Math.PI * 2,
          vRot: (Math.random() - 0.5) * 0.16,
          color: colors[Math.floor(Math.random() * colors.length)],
          alpha: 1,
        });
      }
    }

    function animateCanvas() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      // Ambient drifting gold & rose sparkles
      for (let i = 0; i < ambientParticles.length; i++) {
        const p = ambientParticles[i];
        p.x += p.vx;
        p.y += p.vy * (isCelebrating ? 1.9 : 1);

        if (p.y < -10) {
          p.y = canvas.height + 10;
          p.x = Math.random() * canvas.width;
        }
        if (p.x < -10) p.x = canvas.width + 10;
        if (p.x > canvas.width + 10) p.x = -10;

        ctx.save();
        ctx.globalAlpha = p.alpha;
        ctx.fillStyle = p.color;
        ctx.shadowBlur = 8;
        ctx.shadowColor = p.color;
        ctx.beginPath();
        ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
        ctx.fill();
        ctx.restore();
      }

      // Falling celebration confetti
      for (let i = confettiParticles.length - 1; i >= 0; i--) {
        const c = confettiParticles[i];
        c.x += c.vx;
        c.y += c.vy;
        c.rot += c.vRot;
        if (c.y > canvas.height * 0.8) c.alpha -= 0.02;

        if (c.y > canvas.height + 20 || c.alpha <= 0) {
          confettiParticles.splice(i, 1);
          continue;
        }

        ctx.save();
        ctx.translate(c.x, c.y);
        ctx.rotate(c.rot);
        ctx.globalAlpha = Math.max(0, c.alpha);
        ctx.fillStyle = c.color;
        ctx.fillRect(-c.w / 2, -c.h / 2, c.w, c.h);
        ctx.restore();
      }

      requestAnimationFrame(animateCanvas);
    }

    // Boot App
    window.addEventListener('resize', resizeCanvas);
    window.addEventListener('load', () => {
      resizeCanvas();
      initAmbientParticles();
      animateCanvas();
      renderStage();
    });
  </script>
</body>
</html>
