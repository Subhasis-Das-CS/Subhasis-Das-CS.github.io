  <style>
    /* Base velvety background & smooth typography rendering */
    html,
    body {
      height: 100%;
      margin: 0;
      padding: 0;
      background: radial-gradient(circle at 50% 18%, #341528 0%, #220e1a 48%, #160b14 100%);
      color: #f9f1ed;
      overflow-x: hidden;
      -webkit-tap-highlight-color: transparent;
    }

    /* Glassmorphic Card Styling */
    .glass-card {
      background: linear-gradient(
        145deg,
        rgba(48, 20, 36, 0.74) 0%,
        rgba(24, 11, 21, 0.86) 100%
      );
      backdrop-filter: blur(18px);
      -webkit-backdrop-filter: blur(18px);
      border: 1px solid rgba(229, 192, 123, 0.24);
      box-shadow:
        0 24px 60px -12px rgba(0, 0, 0, 0.65),
        inset 0 1px 0 rgba(247, 229, 192, 0.14);
    }

    /* Delicate gold shimmer text */
    .text-gold-gradient {
      background: linear-gradient(120deg, #f9e8c7 0%, #e5c07b 50%, #f5d8a3 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    /* Smooth step entrance animations */
    @keyframes fadeSlideUp {
      0% {
        opacity: 0;
        transform: translateY(18px) scale(0.985);
      }
      100% {
        opacity: 1;
        transform: translateY(0) scale(1);
      }
    }

    .animate-step-in {
      animation: fadeSlideUp 0.65s cubic-bezier(0.22, 1, 0.36, 1) forwards;
    }

    /* Wax seal gentle pulse */
    @keyframes sealPulse {
      0%, 100% {
        transform: scale(1);
        box-shadow: 0 0 0 0 rgba(229, 192, 123, 0.45), 0 10px 28px rgba(0, 0, 0, 0.55);
      }
      50% {
        transform: scale(1.06);
        box-shadow: 0 0 0 14px rgba(229, 192, 123, 0), 0 14px 34px rgba(217, 122, 140, 0.35);
      }
    }

    .wax-seal-pulse {
      animation: sealPulse 2.8s ease-in-out infinite;
    }

    /* Envelope Flap 3D Opening Animation */
    .envelope-scene {
      perspective: 1000px;
    }

    .envelope-flap {
      transform-origin: top center;
      transition: transform 0.85s cubic-bezier(0.4, 0, 0.2, 1);
      transform-style: preserve-3d;
    }

    .envelope-opened .envelope-flap {
      transform: rotateX(175deg);
    }

    .envelope-letter {
      transition: transform 0.9s cubic-bezier(0.22, 1, 0.36, 1) 0.22s, opacity 0.6s ease 0.22s;
    }

    .envelope-opened .envelope-letter {
      transform: translateY(-54px);
      opacity: 1;
    }

    .envelope-opened .wax-seal-wrapper {
      opacity: 0;
      transform: scale(1.35);
      pointer-events: none;
    }

    /* Floating Heart & Diamond Burst DOM particles */
    @keyframes floatBurst {
      0% {
        opacity: 1;
        transform: translate(-50%, -50%) scale(0.4) rotate(0deg);
      }
      100% {
        opacity: 0;
        transform: translate(calc(-50% + var(--tx)), calc(-50% + var(--ty))) scale(var(--sc)) rotate(var(--rot));
      }
    }

    .burst-particle {
      position: fixed;
      pointer-events: none;
      z-index: 9999;
      animation: floatBurst var(--dur) cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }

    /* Secret Note Smooth Accordion */
    .secret-note-panel {
      display: grid;
      grid-template-rows: 0fr;
      transition: grid-template-rows 0.45s cubic-bezier(0.22, 1, 0.36, 1), opacity 0.4s ease;
      opacity: 0;
    }

    .secret-note-panel.open {
      grid-template-rows: 1fr;
      opacity: 1;
    }

    .secret-note-inner {
      overflow: hidden;
    }

    /* Subtle Glow for Active Reason Stars */
    .reason-btn-active {
      background: radial-gradient(circle at 50% 40%, rgba(229, 192, 123, 0.3), rgba(217, 122, 140, 0.16));
      border-color: rgba(247, 229, 192, 0.72);
      box-shadow: 0 0 22px rgba(229, 192, 123, 0.28), inset 0 0 12px rgba(247, 229, 192, 0.14);
    }

    /* Zoomable Photo Hover Cue */
    .zoomable-photo {
      cursor: zoom-in;
      transition: transform 0.6s cubic-bezier(0.22, 1, 0.36, 1);
    }
    .zoomable-photo:hover {
      transform: scale(1.035);
    }

    /* Lightbox Transition */
    .lightbox-backdrop {
      transition: opacity 0.3s ease;
    }

    /* Cinematic Slideshow Soft Slow-Zoom (Ken Burns) & Crossfade Effects */
    @keyframes kenBurnsZoomIn {
      0% {
        transform: scale(1) translate3d(0, 0, 0);
      }
      100% {
        transform: scale(1.13) translate3d(0, -1.5%, 0);
      }
    }

    @keyframes kenBurnsPanRight {
      0% {
        transform: scale(1.02) translate3d(-1.5%, 0, 0);
      }
      100% {
        transform: scale(1.14) translate3d(1.5%, -1%, 0);
      }
    }

    @keyframes kenBurnsPanLeft {
      0% {
        transform: scale(1.02) translate3d(1.5%, 0, 0);
      }
      100% {
        transform: scale(1.14) translate3d(-1.5%, -1%, 0);
      }
    }

    @keyframes kenBurnsDriftUp {
      0% {
        transform: scale(1.01) translate3d(0, 1.5%, 0);
      }
      100% {
        transform: scale(1.13) translate3d(0, -1.8%, 0);
      }
    }

    .kb-anim-0 {
      animation: kenBurnsZoomIn 6.8s ease-out forwards;
    }
    .kb-anim-1 {
      animation: kenBurnsPanRight 6.8s ease-out forwards;
    }
    .kb-anim-2 {
      animation: kenBurnsPanLeft 6.8s ease-out forwards;
    }
    .kb-anim-3 {
      animation: kenBurnsDriftUp 6.8s ease-out forwards;
    }

    .slideshow-paused .kb-anim-0,
    .slideshow-paused .kb-anim-1,
    .slideshow-paused .kb-anim-2,
    .slideshow-paused .kb-anim-3 {
      animation-play-state: paused;
    }

    .slide-layer {
      transition: opacity 1.35s cubic-bezier(0.4, 0, 0.2, 1), filter 1.35s ease;
      will-change: transform, opacity;
    }

    @keyframes captionSoftIn {
      0% {
        opacity: 0;
        transform: translateY(10px);
      }
      100% {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .caption-fade-in {
      animation: captionSoftIn 0.9s cubic-bezier(0.22, 1, 0.36, 1) forwards;
    }

    /* Dreamy, Softly Blurred Background Photo Slideshow */
    @keyframes bgKenBurns0 {
      0% {
        transform: scale(1.06) translate3d(0, 0, 0);
      }
      100% {
        transform: scale(1.22) translate3d(-1.5%, -2%, 0);
      }
    }

    @keyframes bgKenBurns1 {
      0% {
        transform: scale(1.08) translate3d(-2%, 1%, 0);
      }
      100% {
        transform: scale(1.24) translate3d(2%, -1.5%, 0);
      }
    }

    @keyframes bgKenBurns2 {
      0% {
        transform: scale(1.08) translate3d(2%, -1%, 0);
      }
      100% {
        transform: scale(1.22) translate3d(-2%, 1.5%, 0);
      }
    }

    @keyframes bgKenBurns3 {
      0% {
        transform: scale(1.06) translate3d(0, 2%, 0);
      }
      100% {
        transform: scale(1.23) translate3d(1%, -2%, 0);
      }
    }

    .bg-slide-layer {
      transition: opacity 2.6s cubic-bezier(0.4, 0, 0.2, 1);
      will-change: opacity;
    }

    .bg-slide-img {
      filter: blur(7px) saturate(1.18) brightness(0.62) contrast(1.04);
      will-change: transform;
    }

    .bg-kb-0 {
      animation: bgKenBurns0 10.5s ease-out forwards;
    }
    .bg-kb-1 {
      animation: bgKenBurns1 10.5s ease-out forwards;
    }
    .bg-kb-2 {
      animation: bgKenBurns2 10.5s ease-out forwards;
    }
    .bg-kb-3 {
      animation: bgKenBurns3 10.5s ease-out forwards;
    }

    /* Custom subtle scrollbar */
    ::-webkit-scrollbar {
      width: 5px;
    }
    ::-webkit-scrollbar-track {
      background: transparent;
    }
    ::-webkit-scrollbar-thumb {
      background: rgba(229, 192, 123, 0.25);
      border-radius: 999px;
    }
  </style>
</head>

    /**
     * Lightbox Open / Close & Photo Fallback Binding
     */
    function openLightbox(url, caption) {
      if (!url) return;
      lightboxImg.src = url;
      lightboxCaption.textContent = caption || '';
      photoLightbox.classList.remove('hidden');
      requestAnimationFrame(() => {
        photoLightbox.classList.remove('opacity-0');
        photoLightbox.classList.add('opacity-100');
      });
      lightboxOpen = true;
    }

    function closeLightbox() {
      photoLightbox.classList.remove('opacity-100');
      photoLightbox.classList.add('opacity-0');
      setTimeout(() => {
        photoLightbox.classList.add('hidden');
        lightboxImg.src = '';
      }, 280);
      lightboxOpen = false;
    }

    lightboxCloseBtn.addEventListener('click', closeLightbox);
    photoLightbox.addEventListener('click', (e) => {
      if (e.target === photoLightbox) closeLightbox();
    });

    function bindPhotoZoom(imgEl, url, caption, svgArt, gradient) {
      if (!imgEl) return;

      // Graceful SVG fallback if local image is missing in preview
      imgEl.addEventListener('error', () => {
        const parent = imgEl.parentElement;
        if (!parent) return;
        parent.innerHTML = `
          <div class="w-full h-full bg-gradient-to-br ${gradient} flex flex-col items-center justify-center p-4 text-center">
            ${getSvgIllustration(svgArt)}
            <span class="mt-2 text-[10px] uppercase tracking-widest text-gold-light/65">Photo Preview Ready</span>
          </div>
        `;
      });

      imgEl.addEventListener('click', (e) => {
        e.stopPropagation();
        openLightbox(url, caption);
      });
    }

    /**
     * Smooth Number Counter Animation (Used on Milestone Screen)
     */
    function animateCount(el, start, end, duration) {
      if (!el) return;
      const startTime = performance.now();
      function tick(now) {
        const elapsed = now - startTime;
        const progress = Math.min(elapsed / duration, 1);
        const eased = 1 - Math.pow(1 - progress, 3);
        const current = Math.floor(start + (end - start) * eased);
        el.textContent = current.toLocaleString();
        if (progress < 1) {
          requestAnimationFrame(tick);
        } else {
          el.textContent = end.toLocaleString();
        }
      }
      requestAnimationFrame(tick);
    }

    /**
     * Header, Progress Dots & Bottom Navigation Sync
     */
    function updateChrome() {
      if (currentStep === 0) {
        topHeader.classList.add('opacity-0', 'pointer-events-none');
        topHeader.classList.remove('opacity-100', 'pointer-events-auto');
        bottomNav.classList.add('opacity-0', 'pointer-events-none');
        bottomNav.classList.remove('opacity-100', 'pointer-events-auto');
        return;
      }

      topHeader.classList.remove('opacity-0', 'pointer-events-none');
      topHeader.classList.add('opacity-100', 'pointer-events-auto');
      bottomNav.classList.remove('opacity-0', 'pointer-events-none');
      bottomNav.classList.add('opacity-100', 'pointer-events-auto');

      stepCounter.textContent = `${currentStep} / ${TOTAL_STEPS - 1}`;

      if (currentStep === 1) {
        stageLabel.textContent = 'Our Milestone';
        nextBtnText.textContent = 'Relive Our Moments';
      } else if (currentStep >= 2 && currentStep <= 9) {
        const m = STORY_CONFIG.moments[currentStep - 2];
        stageLabel.textContent = `Moment ${m.roman} of VIII`;
        nextBtnText.textContent = currentStep === 9 ? '8 Little Reasons' : 'Next Moment';
      } else if (currentStep === 10) {
        stageLabel.textContent = '8 Little Reasons';
        nextBtnText.textContent = 'Read My Letter';
      } else {
        stageLabel.textContent = 'My Letter to You';
      }

      // Hide Next button on Finale step (Finale has Celebrate + Replay buttons)
      if (currentStep === TOTAL_STEPS - 1) {
        nextBtn.classList.add('invisible', 'pointer-events-none');
      } else {
        nextBtn.classList.remove('invisible', 'pointer-events-none');
      }

      // Render 11 interactive progress dots (Steps 1–11)
      progressDots.innerHTML = '';
      for (let i = 1; i < TOTAL_STEPS; i++) {
        const dot = document.createElement('button');
        dot.type = 'button';
        dot.setAttribute('aria-label', `Go to step ${i}`);
        const isActive = i === currentStep;
        const isVisited = i < currentStep;
        dot.className = `h-2 rounded-full transition-all duration-300 focus:outline-none ${
          isActive
            ? 'w-7 bg-gradient-to-r from-gold-light to-gold shadow-sm shadow-gold/50'
            : isVisited
            ? 'w-2 bg-gold/65 hover:bg-gold-light'
            : 'w-2 bg-white/20 hover:bg-white/40'
        }`;
        dot.addEventListener('click', () => goToStep(i));
        progressDots.appendChild(dot);
      }
    }

    /**
     * ============================================================================
     * CINEMATIC PHOTO SLIDESHOW (Slow Ken Burns Zoom-In & Soft Crossfade)
     * ============================================================================
     */
    const SLIDE_DURATION_MS = 5600;
    const SLIDESHOW_ITEMS = [
      {
        tag: '8 Months of Us 💎✨',
        title: 'My Subbu & Your Smoll Baby 🐣',
        caption: STORY_CONFIG.coverPhoto.caption,
        url: STORY_CONFIG.coverPhoto.url,
        position: STORY_CONFIG.coverPhoto.position,
      },
      ...STORY_CONFIG.moments.map((m) => ({
        tag: `Moment ${m.roman}`,
        title: m.title,
        caption: m.photoCaption,
        url: m.photoUrl,
        position: m.photoPosition,
      })),
      {
        tag: 'Forever Yours 💎✨',
        title: 'My Dearest Subhanwita',
        caption: STORY_CONFIG.finalePhoto.caption,
        url: STORY_CONFIG.finalePhoto.url,
        position: STORY_CONFIG.finalePhoto.position,
      },
    ];

    const slideshowModal = document.getElementById('slideshowModal');
    const slideshowStage = document.getElementById('slideshowStage');
    const slideLayerA = document.getElementById('slideLayerA');
    const slideLayerB = document.getElementById('slideLayerB');
    const slideshowTag = document.getElementById('slideshowTag');
    const slideshowTitle = document.getElementById('slideshowTitle');
    const slideshowCaption = document.getElementById('slideshowCaption');
    const slideshowCounter = document.getElementById('slideshowCounter');
    const slideshowProgressBar = document.getElementById('slideshowProgressBar');
    const slideshowDots = document.getElementById('slideshowDots');
    const slideshowCloseBtn = document.getElementById('slideshowCloseBtn');
    const slideshowPrevBtn = document.getElementById('slideshowPrevBtn');
    const slideshowNextBtn = document.getElementById('slideshowNextBtn');
    const slideshowPlayPauseBtn = document.getElementById('slideshowPlayPauseBtn');

    let slideIndex = 0;
    let activeLayerToggle = true; // alternates between Layer A and Layer B for seamless crossfade
    let slidePlaying = true;
    let slideTimer = null;

    function renderSlideshowDots() {
      slideshowDots.innerHTML = '';
      SLIDESHOW_ITEMS.forEach((_, idx) => {
        const dot = document.createElement('button');
        dot.type = 'button';
        dot.setAttribute('aria-label', `View slide ${idx + 1}`);
        const isCurrent = idx === slideIndex;
        dot.className = `h-1.5 rounded-full transition-all duration-300 focus:outline-none ${
          isCurrent ? 'w-6 bg-gold-light' : 'w-1.5 bg-white/25 hover:bg-white/50'
        }`;
        dot.addEventListener('click', () => showSlide(idx));
        slideshowDots.appendChild(dot);
      });
    }

    function restartSlideProgress() {
      slideshowProgressBar.style.transition = 'none';
      slideshowProgressBar.style.width = '0%';
      void slideshowProgressBar.offsetWidth;
      if (slidePlaying) {
        slideshowProgressBar.style.transition = `width ${SLIDE_DURATION_MS}ms linear`;
        slideshowProgressBar.style.width = '100%';
      }
    }

    function scheduleNextSlide() {
      clearTimeout(slideTimer);
      if (!slidePlaying || !slideshowOpen) return;
      slideTimer = setTimeout(() => {
        showSlide((slideIndex + 1) % SLIDESHOW_ITEMS.length);
      }, SLIDE_DURATION_MS);
    }

    function showSlide(idx) {
      slideIndex = (idx + SLIDESHOW_ITEMS.length) % SLIDESHOW_ITEMS.length;
      const item = SLIDESHOW_ITEMS[slideIndex];

      const incomingLayer = activeLayerToggle ? slideLayerA : slideLayerB;
      const outgoingLayer = activeLayerToggle ? slideLayerB : slideLayerA;
      activeLayerToggle = !activeLayerToggle;

      const incomingImg = incomingLayer.querySelector('img');
      incomingImg.src = item.url;
      incomingImg.alt = item.caption;
      incomingImg.style.objectPosition = item.position || '50% 25%';

      // Reset & apply alternating soft slow-zoom / pan Ken Burns animation
      incomingImg.className = 'w-full h-full object-cover';
      void incomingImg.offsetWidth;
      incomingImg.classList.add(`kb-anim-${slideIndex % 4}`);

      // Crossfade layers smoothly
      incomingLayer.style.zIndex = '2';
      outgoingLayer.style.zIndex = '1';
      incomingLayer.style.opacity = '1';
      outgoingLayer.style.opacity = '0';

      // Soft caption fade-in
      [slideshowTag, slideshowTitle, slideshowCaption].forEach((el) => {
        el.classList.remove('caption-fade-in');
        void el.offsetWidth;
        el.classList.add('caption-fade-in');
      });
      slideshowTag.textContent = item.tag;
      slideshowTitle.textContent = item.title;
      slideshowCaption.textContent = item.caption;
      slideshowCounter.textContent = `${slideIndex + 1} / ${SLIDESHOW_ITEMS.length}`;

      renderSlideshowDots();
      restartSlideProgress();
      scheduleNextSlide();
    }

    function openSlideshow(startIdx = 0) {
      slideshowOpen = true;
      slidePlaying = true;
      slideshowStage.classList.remove('slideshow-paused');
      slideshowPlayPauseBtn.textContent = '⏸ Pause';

      // Reset both layers before opening
      slideLayerA.style.opacity = '0';
      slideLayerB.style.opacity = '0';

      slideshowModal.classList.remove('hidden');
      requestAnimationFrame(() => {
        slideshowModal.classList.remove('opacity-0');
        slideshowModal.classList.add('opacity-100');
      });

      startBackgroundMusic();
      showSlide(startIdx);
    }

    function closeSlideshow() {
      clearTimeout(slideTimer);
      slideshowModal.classList.remove('opacity-100');
      slideshowModal.classList.add('opacity-0');
      setTimeout(() => {
        slideshowModal.classList.add('hidden');
      }, 280);
      slideshowOpen = false;
    }

    function toggleSlideshowPlayback() {
      slidePlaying = !slidePlaying;
      if (slidePlaying) {
        slideshowStage.classList.remove('slideshow-paused');
        slideshowPlayPauseBtn.textContent = '⏸ Pause';
        restartSlideProgress();
        scheduleNextSlide();
      } else {
        clearTimeout(slideTimer);
        slideshowStage.classList.add('slideshow-paused');
        slideshowPlayPauseBtn.textContent = '▶ Play';
        const computedWidth = getComputedStyle(slideshowProgressBar).width;
        slideshowProgressBar.style.transition = 'none';
        slideshowProgressBar.style.width = computedWidth;
      }
    }

    headerSlideshowBtn.addEventListener('click', () => openSlideshow(0));
    slideshowCloseBtn.addEventListener('click', closeSlideshow);
    slideshowPrevBtn.addEventListener('click', () => showSlide(slideIndex - 1));
    slideshowNextBtn.addEventListener('click', () => showSlide(slideIndex + 1));
    slideshowPlayPauseBtn.addEventListener('click', toggleSlideshowPlayback);
    slideshowModal.addEventListener('click', (e) => {
      if (e.target === slideshowModal) closeSlideshow();
    });

    // Touch Swipe inside Slideshow
    let slideTouchX = 0;
    slideshowStage.addEventListener(
      'touchstart',
      (e) => {
        slideTouchX = e.changedTouches[0].screenX;
      },
      { passive: true }
    );
    slideshowStage.addEventListener(
      'touchend',
      (e) => {
        const dx = e.changedTouches[0].screenX - slideTouchX;
        if (Math.abs(dx) > 45) {
          if (dx < 0) showSlide(slideIndex + 1);
          else showSlide(slideIndex - 1);
        }
      },
      { passive: true }
    );

    /**
     * Navigation Helpers & Input Listeners
     */
    function goToStep(stepIndex) {
      if (stepIndex < 0 || stepIndex >= TOTAL_STEPS) return;
      currentStep = stepIndex;
      renderCurrentStep();
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    prevBtn.addEventListener('click', () => {
      if (currentStep > 0) goToStep(currentStep - 1);
    });

    nextBtn.addEventListener('click', () => {
      if (currentStep < TOTAL_STEPS - 1) goToStep(currentStep + 1);
    });

    // Keyboard Navigation (Escape closes lightbox/slideshow; Left/Right/Space navigate)
    window.addEventListener('keydown', (e) => {
      if (slideshowOpen) {
        if (e.key === 'Escape') {
          closeSlideshow();
        } else if (e.key === 'ArrowRight') {
          showSlide(slideIndex + 1);
        } else if (e.key === 'ArrowLeft') {
          showSlide(slideIndex - 1);
        } else if (e.key === ' ') {
          e.preventDefault();
          toggleSlideshowPlayback();
        }
        return;
      }

      if (e.key === 'Escape' && lightboxOpen) {
        closeLightbox();
        return;
      }
      if (lightboxOpen) return;

      if (e.key === 'ArrowRight') {
        if (currentStep === 0) {
          const box = document.getElementById('envelopeBox');
          if (box) box.click();
        } else if (currentStep < TOTAL_STEPS - 1) {
          goToStep(currentStep + 1);
        }
      } else if (e.key === 'ArrowLeft') {
        if (currentStep > 0) goToStep(currentStep - 1);
      } else if (e.key === ' ' && document.activeElement === document.body) {
        e.preventDefault();
        if (currentStep === 0) {
          const box = document.getElementById('envelopeBox');
          if (box) box.click();
        } else if (currentStep < TOTAL_STEPS - 1) {
          goToStep(currentStep + 1);
        }
      }
    });

    // Mobile Touch Swipe Support
    let touchStartX = 0;
    let touchStartY = 0;
    window.addEventListener(
      'touchstart',
      (e) => {
        touchStartX = e.changedTouches[0].screenX;
        touchStartY = e.changedTouches[0].screenY;
      },
      { passive: true }
    );
    window.addEventListener(
      'touchend',
      (e) => {
        if (currentStep === 0 || lightboxOpen || slideshowOpen) return;
        const dx = e.changedTouches[0].screenX - touchStartX;
        const dy = e.changedTouches[0].screenY - touchStartY;
        if (Math.abs(dx) > 55 && Math.abs(dx) > Math.abs(dy) * 1.4) {
          if (dx < 0 && currentStep < TOTAL_STEPS - 1) {
            goToStep(currentStep + 1);
          } else if (dx > 0 && currentStep > 0) {
            goToStep(currentStep - 1);
          }
        }
      },
      { passive: true }
    );

    /**
     * ============================================================================
     * FLOATING HEART, DIAMOND & SPARKLE CLICK BURST EFFECT
     * ============================================================================
     */
    function spawnHeartBurst(x, y, count = 12) {
      const symbols = ['♥', '💎', '✨', '✦', '♡'];
      const colors = ['#f7e5c0', '#e5c07b', '#f5cfd6', '#d97a8c'];

      for (let i = 0; i < count; i++) {
        const el = document.createElement('span');
        el.className = 'burst-particle select-none';
        el.textContent = symbols[Math.floor(Math.random() * symbols.length)];
        el.style.left = `${x}px`;
        el.style.top = `${y}px`;
        el.style.color = colors[Math.floor(Math.random() * colors.length)];
        el.style.fontSize = `${12 + Math.random() * 13}px`;

        const angle = (Math.PI * 2 * i) / count + (Math.random() - 0.5) * 0.6;
        const distance = 45 + Math.random() * 98;
        const tx = Math.cos(angle) * distance;
        const ty = Math.sin(angle) * distance - 36;

        el.style.setProperty('--tx', `${tx}px`);
        el.style.setProperty('--ty', `${ty}px`);
        el.style.setProperty('--sc', (0.8 + Math.random() * 0.9).toFixed(2));
        el.style.setProperty('--rot', `${Math.floor(Math.random() * 70 - 35)}deg`);
        el.style.setProperty('--dur', `${0.75 + Math.random() * 0.55}s`);

        document.body.appendChild(el);
        setTimeout(() => el.remove(), 1400);
      }
    }

    /**
     * ============================================================================
     * AMBIENT CANVAS: GOLDEN PARTICLES, ROSE PETALS & SUBTLE DIAMOND SPARKLES
     * ============================================================================
     */
    const canvas = document.getElementById('ambientCanvas');
    const ctx = canvas.getContext('2d');
    let particles = [];
    let celebrationBoost = 0;

    function resizeCanvas() {
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
    }

    function createParticle(isBurst = false) {
      const rand = Math.random();
      const kind = rand < 0.22 ? 'petal' : rand < 0.38 ? 'diamond' : 'gold';
      return {
        x: Math.random() * canvas.width,
        y: isBurst ? canvas.height + 10 : Math.random() * canvas.height,
        size:
          kind === 'petal'
            ? 3.5 + Math.random() * 3.5
            : kind === 'diamond'
            ? 2.2 + Math.random() * 2.4
            : 1 + Math.random() * 2.2,
        speedY: isBurst ? -(1.3 + Math.random() * 2.2) : -(0.18 + Math.random() * 0.42),
        speedX: (Math.random() - 0.5) * 0.35,
        swayOffset: Math.random() * Math.PI * 2,
        opacity: 0.2 + Math.random() * 0.55,
        kind,
        color:
          kind === 'petal'
            ? '#d97a8c'
            : kind === 'diamond'
            ? '#f7e5c0'
            : Math.random() > 0.35
            ? '#f7e5c0'
            : '#e5c07b',
        rotation: Math.random() * Math.PI * 2,
        rotSpeed: (Math.random() - 0.5) * 0.02,
      };
    }

    function initParticles() {
      particles = [];
      const count = window.innerWidth < 640 ? 42 : 70;
      for (let i = 0; i < count; i++) {
        particles.push(createParticle(false));
      }
    }

    function triggerCanvasCelebration() {
      celebrationBoost = 45;
      for (let i = 0; i < 26; i++) {
        particles.push(createParticle(true));
      }
      setTimeout(() => {
        const targetCount = window.innerWidth < 640 ? 42 : 70;
        if (particles.length > targetCount) {
          particles.splice(0, particles.length - targetCount);
        }
      }, 4500);
    }

    function animateCanvas() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      if (celebrationBoost > 0) celebrationBoost *= 0.96;

      for (let i = 0; i < particles.length; i++) {
        const p = particles[i];
        p.swayOffset += 0.015;
        p.x += p.speedX + Math.sin(p.swayOffset) * 0.28;
        p.y += p.speedY * (1 + celebrationBoost * 0.03);
        p.rotation += p.rotSpeed;

        if (p.y < -15) {
          p.y = canvas.height + 15;
          p.x = Math.random() * canvas.width;
        }
        if (p.x < -15) p.x = canvas.width + 15;
        if (p.x > canvas.width + 15) p.x = -15;

        ctx.save();
        ctx.translate(p.x, p.y);
        ctx.rotate(p.rotation);
        ctx.globalAlpha = p.opacity;

        if (p.kind === 'petal') {
          ctx.fillStyle = p.color;
          ctx.beginPath();
          ctx.ellipse(0, 0, p.size, p.size * 0.55, 0, 0, Math.PI * 2);
          ctx.fill();
        } else if (p.kind === 'diamond') {
          // Delicate 4-point diamond sparkle
          ctx.fillStyle = p.color;
          ctx.shadowBlur = 10;
          ctx.shadowColor = '#f7e5c0';
          ctx.beginPath();
          ctx.moveTo(0, -p.size * 1.4);
          ctx.lineTo(p.size * 0.65, 0);
          ctx.lineTo(0, p.size * 1.4);
          ctx.lineTo(-p.size * 0.65, 0);
          ctx.closePath();
          ctx.fill();
        } else {
          ctx.fillStyle = p.color;
          ctx.shadowBlur = 8;
          ctx.shadowColor = p.color;
          ctx.beginPath();
          ctx.arc(0, 0, p.size, 0, Math.PI * 2);
          ctx.fill();
        }
        ctx.restore();
      }

      drawAnalogMusicWave();
      requestAnimationFrame(animateCanvas);
    }

    /**
     * ============================================================================
     * INVISIBLE BACKGROUND MUSIC (ms.mp3) & AMBIENT ANALOG WAVEFORM
     * ============================================================================
     * Starts silently on the first tap/click anywhere on the screen.
     * Uses Web Audio AnalyserNode when hosted (real-time oscilloscope wave) and
     * gracefully falls back to an organic analog wave when opened via file://
     * so audio playback is never muted by local CORS restrictions.
     */
    const bgMusic = document.getElementById('bgMusic');
    let musicStarted = false;
    let audioCtx = null;
    let analyser = null;
    let waveData = null;
    let waveEnergy = 0;
    let wavePhase = 0;

    function initAudioAnalyser() {
      // Skip MediaElementSource on file:// protocol to prevent browser CORS muting
      if (window.location.protocol === 'file:' || analyser) return;
      try {
        const AudioContextClass = window.AudioContext || window.webkitAudioContext;
        if (!AudioContextClass) return;
        audioCtx = new AudioContextClass();
        const source = audioCtx.createMediaElementSource(bgMusic);
        analyser = audioCtx.createAnalyser();
        analyser.fftSize = 256;
        analyser.smoothingTimeConstant = 0.85;
        source.connect(analyser);
        analyser.connect(audioCtx.destination);
        waveData = new Uint8Array(analyser.frequencyBinCount);
      } catch (err) {
        analyser = null;
      }
    }

    function startBackgroundMusic() {
      if (musicStarted || !bgMusic) return;
      initAudioAnalyser();
      if (audioCtx && audioCtx.state === 'suspended') {
        audioCtx.resume().catch(() => {});
      }
      bgMusic.volume = 0.7;
      const playPromise = bgMusic.play();
      if (playPromise !== undefined) {
        playPromise
          .then(() => {
            musicStarted = true;
            window.removeEventListener('pointerdown', startBackgroundMusic);
            window.removeEventListener('click', startBackgroundMusic);
            window.removeEventListener('keydown', startBackgroundMusic);
          })
          .catch(() => {
            // Retry on next user gesture if browser blocked autoplay
          });
      }
    }

    // Trigger music seamlessly on the very first interaction anywhere on screen
    window.addEventListener('pointerdown', startBackgroundMusic, { passive: true });
    window.addEventListener('click', startBackgroundMusic, { passive: true });
    window.addEventListener('keydown', startBackgroundMusic, { passive: true });

    function drawAnalogMusicWave() {
      const isPlaying = musicStarted && bgMusic && !bgMusic.paused;
      const targetEnergy = isPlaying ? 1 : 0;
      waveEnergy += (targetEnergy - waveEnergy) * 0.04;
      if (waveEnergy < 0.005) return;

      wavePhase += 0.032;

      // Read live audio oscilloscope data if Web Audio analyser is active
      let hasLiveSignal = false;
      if (analyser && waveData) {
        analyser.getByteTimeDomainData(waveData);
        for (let i = 0; i < waveData.length; i++) {
          if (Math.abs(waveData[i] - 128) > 2) {
            hasLiveSignal = true;
            break;
          }
        }
      }

      const w = canvas.width;
      const baseY = canvas.height - (w < 640 ? 22 : 28);
      const maxAmp = w < 640 ? 13 : 17;
      const points = 96;

      // Soft horizontal fade at left & right viewport edges
      const goldGrad = ctx.createLinearGradient(0, baseY, w, baseY);
      goldGrad.addColorStop(0, 'rgba(229, 192, 123, 0)');
      goldGrad.addColorStop(0.2, 'rgba(217, 122, 140, 0.45)');
      goldGrad.addColorStop(0.5, 'rgba(247, 229, 192, 0.78)');
      goldGrad.addColorStop(0.8, 'rgba(217, 122, 140, 0.45)');
      goldGrad.addColorStop(1, 'rgba(229, 192, 123, 0)');

      const roseGrad = ctx.createLinearGradient(0, baseY, w, baseY);
      roseGrad.addColorStop(0, 'rgba(217, 122, 140, 0)');
      roseGrad.addColorStop(0.25, 'rgba(217, 122, 140, 0.32)');
      roseGrad.addColorStop(0.5, 'rgba(245, 207, 214, 0.42)');
      roseGrad.addColorStop(0.75, 'rgba(217, 122, 140, 0.32)');
      roseGrad.addColorStop(1, 'rgba(217, 122, 140, 0)');

      const layers = [
        { stroke: roseGrad, width: 1.2, phaseOffset: 1.15, ampScale: 0.65, blur: 6 },
        { stroke: goldGrad, width: 1.75, phaseOffset: 0, ampScale: 1, blur: 10 },
      ];

      layers.forEach((layer) => {
        ctx.save();
        ctx.beginPath();
        ctx.strokeStyle = layer.stroke;
        ctx.lineWidth = layer.width;
        ctx.globalAlpha = 0.85 * waveEnergy;
        ctx.shadowBlur = layer.blur;
        ctx.shadowColor = 'rgba(247, 229, 192, 0.55)';

        for (let i = 0; i <= points; i++) {
          const t = i / points;
          const x = t * w;
          // Bell-curve envelope so wave tapers smoothly to 0 at edges
          const envelope = Math.sin(t * Math.PI);
          let yOffset = 0;

          if (hasLiveSignal && waveData) {
            const dataIdx = Math.min(waveData.length - 1, Math.floor(t * waveData.length));
            const normalized = (waveData[dataIdx] - 128) / 128;
            const subtleSway =
              Math.sin(t * Math.PI * 5 + wavePhase + layer.phaseOffset) * 0.14;
            yOffset = (normalized * 1.65 + subtleSway) * maxAmp * layer.ampScale * envelope;
          } else {
            // Smooth multi-harmonic analog wave fallback (e.g., on file:// local viewing)
            const wave1 = Math.sin(t * Math.PI * 6 + wavePhase + layer.phaseOffset);
            const wave2 = Math.sin(t * Math.PI * 11 - wavePhase * 1.45 + layer.phaseOffset) * 0.45;
            const wave3 = Math.sin(t * Math.PI * 17 + wavePhase * 0.8) * 0.2;
            const breath = 0.72 + 0.28 * Math.sin(wavePhase * 0.55);
            yOffset = (wave1 + wave2 + wave3) * 0.52 * maxAmp * layer.ampScale * envelope * breath;
          }

          const y = baseY + yOffset * waveEnergy;
          if (i === 0) ctx.moveTo(x, y);
          else ctx.lineTo(x, y);
        }

        ctx.stroke();
        ctx.restore();
      });
    }

    // Initialize App on Load
    /**
     * ============================================================================
     * DREAMY AMBIENT BACKGROUND PHOTO SLIDESHOW (Slow Zoom & Soft Crossfade)
     * ============================================================================
     */
    const bgSlideLayerA = document.getElementById('bgSlideLayerA');
    const bgSlideLayerB = document.getElementById('bgSlideLayerB');
    let bgSlideIndex = 0;
    let bgLayerToggle = true;

    function advanceBgSlide() {
      if (!bgSlideLayerA || !bgSlideLayerB || !SLIDESHOW_ITEMS.length) return;
      const item = SLIDESHOW_ITEMS[bgSlideIndex];
      const incoming = bgLayerToggle ? bgSlideLayerA : bgSlideLayerB;
      const outgoing = bgLayerToggle ? bgSlideLayerB : bgSlideLayerA;
      bgLayerToggle = !bgLayerToggle;

      const img = incoming.querySelector('img');
      img.src = item.url;
      img.style.objectPosition = item.position || '50% 25%';

      // Restart smooth slow-zoom & gentle drift animation
      img.className = 'bg-slide-img w-full h-full object-cover';
      void img.offsetWidth;
      img.classList.add(`bg-kb-${bgSlideIndex % 4}`);

      incoming.style.zIndex = '2';
      outgoing.style.zIndex = '1';
      incoming.style.opacity = '0.52';
      outgoing.style.opacity = '0';

      bgSlideIndex = (bgSlideIndex + 1) % SLIDESHOW_ITEMS.length;
    }

    function initAmbientBgSlideshow() {
      advanceBgSlide();
      setInterval(advanceBgSlide, 7200);
    }

    window.addEventListener('resize', resizeCanvas);
    window.addEventListener('load', () => {
      resizeCanvas();
      initParticles();
      animateCanvas();
      initAmbientBgSlideshow();
      renderCurrentStep();
    });
  </script>
</body>
</html>
